/* Video's laden in een rij: hoogstens twee tegelijk, de grootste in beeld (de hero) eerst.
   Zo houden video's nooit de verbindingen bezet die de foto's nodig hebben.
   Buiten beeld laadt niets; stille loops pauzeren als je eraan voorbij scrolt. */
(function(){
  var MAX=2,actief=0,rij=[];
  function klaar(v){if(v.__dolleSlot){v.__dolleSlot=false;actief--;volgende();}}
  function start(v){v.__dolleWacht=false;v.__dolleSlot=true;actief++;
    var los=function(){klaar(v);};["loadeddata","error","stalled"].forEach(function(e){v.addEventListener(e,los,{once:true});});
    setTimeout(los,5000);
    v.preload=v.__dollePre||"metadata";if(v.__dolleAuto)v.autoplay=true;try{v.load();}catch(x){}
    if(v.__dolleAuto&&v.muted){var p=v.play();if(p&&p.catch)p.catch(function(){});}}
  function volgende(){
    rij=rij.filter(function(v){return v.__dolleWacht&&v.isConnected;});
    rij.sort(function(p,q){return (q.__dolleMaat||0)-(p.__dolleMaat||0);});
    while(actief<MAX&&rij.length){start(rij.shift());}}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;
    if(e.isIntersecting){
      if(v.__dolleWacht){var r=e.boundingClientRect;v.__dolleMaat=r.width*r.height;if(rij.indexOf(v)<0)rij.push(v);}
      else if(v.__dolleAuto&&v.muted&&v.paused){var p=v.play();if(p&&p.catch)p.catch(function(){});}
    }else{var i=rij.indexOf(v);if(i>=0)rij.splice(i,1);if(v.__dolleAuto&&v.muted&&!v.paused&&!v.controls)v.pause();}
  });volgende();},{rootMargin:"300px 300px"});
  function neem(v){
    if(v.__dolleGezien)return;v.__dolleGezien=true;
    v.__dolleAuto=v.autoplay||v.hasAttribute("autoplay");
    v.__dollePre=v.getAttribute("preload")||"metadata";
    v.__dolleWacht=true;v.autoplay=false;v.removeAttribute("autoplay");v.preload="none";
    try{v.pause();}catch(x){}
    /* Wil een component zelf afspelen voordat de video aan de beurt is: dan meteen laden. */
    var eigen=v.play.bind(v);v.play=function(){if(v.__dolleWacht){var i=rij.indexOf(v);if(i>=0)rij.splice(i,1);v.__dolleWacht=false;v.preload=v.__dollePre;}return eigen();};
    io.observe(v);}
  function zoek(n){if(!n||n.nodeType!==1)return;if(n.tagName==="VIDEO")neem(n);else if(n.querySelectorAll){var l=n.querySelectorAll("video");for(var i=0;i<l.length;i++)neem(l[i]);}}

})();
</script>

<script id="dolle-video-spaarstand">/* Films buiten beeld pauzeren: scheelt bandbreedte en warmte op mobiel. */
(function(){
  if(!("IntersectionObserver" in window))return;
  /* Alleen hervatten wat dit script zelf heeft stilgezet; wat een component
     bewust stil houdt (hover-loops, dichte rijen) blijft stil. */
  var kijk=new IntersectionObserver(function(rijen){
    rijen.forEach(function(r){
      var v=r.target;
      if(v.dataset.handmatig==="1")return;
      if(v.dataset.trimAan==="1"&&v.autoplay&&v.paused&&r.isIntersecting){v.play().catch(function(){});return;}
      if(r.isIntersecting){
        if(v.paused&&v.muted&&(v.dataset.spaar==="1"||v.autoplay))v.play().catch(function(){});
        v.dataset.spaar="";
      }else if(!v.paused){if(!v.muted||v.controls||v.dataset.film){return;}v.dataset.spaar="1";v.pause();}
    });
  },{rootMargin:"200px 400px",threshold:0});
  var gezien=new WeakSet();
  /* Films ver buiten beeld krijgen hun bron pas als ze in de buurt komen.
     Anders houden tientallen video's alle verbindingen bezet en blijven foto's
     (en andere films) hangen. */
  var laad=new IntersectionObserver(function(rijen){
    rijen.forEach(function(r){
      if(!r.isIntersecting)return;
      var v=r.target;laad.unobserve(v);
      if(v.dataset.lui){v.setAttribute("src",v.dataset.lui);v.dataset.lui="";v.load();if(v.autoplay)v.play().catch(function(){});}
    });
  },{rootMargin:"600px 1200px",threshold:0});
  function dichtbij(v){var b=v.getBoundingClientRect();return b.bottom>-600&&b.top<innerHeight+600;}
  /* Films die ver uit beeld raken terwijl ze nog laden, geven hun verbinding
     terug: bron eraf, en weer erop zodra ze in de buurt komen. */
  var weg=new IntersectionObserver(function(rijen){
    rijen.forEach(function(r){
      var v=r.target;if(r.isIntersecting)return;
      var s=v.getAttribute("src");
      if(!s||!v.muted||v.controls||v.dataset.film||v.dataset.trimAan||v.dataset.handmatig==="1")return;
      if(v.readyState>=3)return;
      v.pause();v.dataset.lui=s;v.removeAttribute("src");v.load();laad.observe(v);
    });
  },{rootMargin:"700px 1400px",threshold:0});
  function scan(){
    document.querySelectorAll("video").forEach(function(v){
      if(gezien.has(v))return;
      gezien.add(v);
      var s=v.getAttribute("src");
      /* Getrimde films (eigen start/eind) houden hun bron: ze zoeken zelf hun startpunt. */
      if(s&&!v.controls&&!v.dataset.film&&!v.dataset.trimAan&&!dichtbij(v)){v.dataset.lui=s;v.removeAttribute("src");v.load();laad.observe(v);}
      if(!v.controls&&!v.dataset.film){kijk.observe(v);weg.observe(v);}
      else v.addEventListener("play",function(){v.dataset.handmatig="1"});
    });
  }
  scan();
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
})();</script>
<script id="dolle-film-terug">/* Een film die je zelf afspeelt stopt zodra hij helemaal uit beeld is en gaat terug naar zijn beginstand (poster met WATCH). */
(function(){
  if(!("IntersectionObserver" in window))return;
  var kijk=new IntersectionObserver(function(rijen){
    rijen.forEach(function(r){
      var v=r.target;
      if(r.isIntersecting||v.paused)return;
      if(v.muted&&!v.controls&&!v.dataset.film)return;
      v.pause();
      try{v.currentTime=0;}catch(e){}
      v.dispatchEvent(new Event("ended"));
    });
  },{threshold:0});
  var gezien=new WeakSet();
  function scan(){document.querySelectorAll("video").forEach(function(v){if(!gezien.has(v)){gezien.add(v);kijk.observe(v);}});}
  scan();
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
})();</script>
<script id="dolle-geluidwacht">/* Geluid alleen na een klik: elke film die zonder recente klik met geluid start, wordt gedempt. */
(function(){var klik=0;["pointerdown","keydown","touchstart"].forEach(function(t){document.addEventListener(t,function(){klik=Date.now();},true);});
document.addEventListener("play",function(e){var v=e.target;if(!v||v.tagName!=="VIDEO"||v.muted)return;if(Date.now()-klik>1500){v.muted=true;}},true);
document.addEventListener("volumechange",function(e){var v=e.target;if(!v||v.tagName!=="VIDEO"||v.muted||v.paused)return;if(Date.now()-klik>1500){v.muted=true;}},true);})();</script>
